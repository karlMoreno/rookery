[project]
name = "rookery-scene"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mujoco==3.16.0",
    "numpy>=2.5.4",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Lets tests/ import the `scene` package without installing it.
pythonpath = ["."]
testpaths = ["tests"]
# Gates are named for their phase (tests/gates/phase2_scene.py), not test_*.
python_files = ["test_*.py", "phase*_*.py"]
