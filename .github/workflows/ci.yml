name: ci

on:
  push:
  pull_request:

env:
  # Must match the macOS framework in ~/.mujoco on the Air (mjVERSION_HEADER 3016000).
  MUJOCO_VERSION: "3.16.0"
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache MuJoCo
        id: mujoco-cache
        uses: actions/cache@v4
        with:
          path: ~/.mujoco/mujoco-${{ env.MUJOCO_VERSION }}
          key: mujoco-${{ runner.os }}-${{ env.MUJOCO_VERSION }}
      - name: Download MuJoCo
        if: steps.mujoco-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.mujoco && cd ~/.mujoco
          base=https://github.com/google-deepmind/mujoco/releases/download/$MUJOCO_VERSION
          tarball=mujoco-$MUJOCO_VERSION-linux-x86_64.tar.gz
          curl -fsSL -O "$base/$tarball" -O "$base/$tarball.sha256"
          sha256sum -c "$tarball.sha256"
          tar xzf "$tarball" && rm "$tarball" "$tarball.sha256"
      - name: Export MuJoCo paths
        run: |
          dir="$HOME/.mujoco/mujoco-$MUJOCO_VERSION"
          echo "MUJOCO_DIR=$dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$dir/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude gates

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache MuJoCo
        id: mujoco-cache
        uses: actions/cache@v4
        with:
          path: ~/.mujoco/mujoco-${{ env.MUJOCO_VERSION }}
          key: mujoco-${{ runner.os }}-${{ env.MUJOCO_VERSION }}
      - name: Download MuJoCo
        if: steps.mujoco-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.mujoco && cd ~/.mujoco
          base=https://github.com/google-deepmind/mujoco/releases/download/$MUJOCO_VERSION
          tarball=mujoco-$MUJOCO_VERSION-linux-x86_64.tar.gz
          curl -fsSL -O "$base/$tarball" -O "$base/$tarball.sha256"
          sha256sum -c "$tarball.sha256"
          tar xzf "$tarball" && rm "$tarball" "$tarball.sha256"
      - name: Export MuJoCo paths
        run: |
          dir="$HOME/.mujoco/mujoco-$MUJOCO_VERSION"
          echo "MUJOCO_DIR=$dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$dir/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: scene
      - run: cargo test -p gates
      - name: Python gates
        working-directory: scene
        # pytest exits 5 when it collects no tests; that's expected until Phase 2.
        run: uv run pytest ../tests/gates -q || [ $? -eq 5 ]
      - run: echo "headless: pending Phase 4"
