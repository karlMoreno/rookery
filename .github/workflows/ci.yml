name: ci

on:
  push:
  pull_request:

env:
  # Must match the macOS framework in ~/.mujoco on the Air (mjVERSION_HEADER 3016000).
  MUJOCO_VERSION: "3.16.0"
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache MuJoCo
        id: mujoco-cache
        uses: actions/cache@v4
        with:
          path: ~/.mujoco/mujoco-${{ env.MUJOCO_VERSION }}
          key: mujoco-${{ runner.os }}-${{ env.MUJOCO_VERSION }}
      - name: Download MuJoCo
        if: steps.mujoco-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.mujoco && cd ~/.mujoco
          base=https://github.com/google-deepmind/mujoco/releases/download/$MUJOCO_VERSION
          tarball=mujoco-$MUJOCO_VERSION-linux-x86_64.tar.gz
          curl -fsSL -O "$base/$tarball" -O "$base/$tarball.sha256"
          sha256sum -c "$tarball.sha256"
          tar xzf "$tarball" && rm "$tarball" "$tarball.sha256"
      - name: Export MuJoCo paths
        run: |
          dir="$HOME/.mujoco/mujoco-$MUJOCO_VERSION"
          echo "MUJOCO_DIR=$dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$dir/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: No unsafe outside crates/sim/src (rule 4)
        run: scripts/check-unsafe.sh
      - name: mast does not depend on rookery-core (row 3.1)
        run: |
          if cargo tree -p mast -e normal | grep -q rookery-core; then
            echo "error: mast depends on rookery-core"; cargo tree -p mast -e normal; exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude gates

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Cache MuJoCo
        id: mujoco-cache
        uses: actions/cache@v4
        with:
          path: ~/.mujoco/mujoco-${{ env.MUJOCO_VERSION }}
          key: mujoco-${{ runner.os }}-${{ env.MUJOCO_VERSION }}
      - name: Download MuJoCo
        if: steps.mujoco-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.mujoco && cd ~/.mujoco
          base=https://github.com/google-deepmind/mujoco/releases/download/$MUJOCO_VERSION
          tarball=mujoco-$MUJOCO_VERSION-linux-x86_64.tar.gz
          curl -fsSL -O "$base/$tarball" -O "$base/$tarball.sha256"
          sha256sum -c "$tarball.sha256"
          tar xzf "$tarball" && rm "$tarball" "$tarball.sha256"
      - name: Export MuJoCo paths
        run: |
          dir="$HOME/.mujoco/mujoco-$MUJOCO_VERSION"
          echo "MUJOCO_DIR=$dir" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$dir/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: scene
      - run: cargo test -p gates
      - name: Software OpenGL for offscreen renders
        run: sudo apt-get update -q && sudo apt-get install -y -q libosmesa6
      - name: Scene unit tests
        working-directory: scene
        env:
          # OSMesa renders on the CPU, so render tests run on a runner with no GPU or display.
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: uv run pytest tests -q
      - name: Generated scenes are up to date (rule 7; row 2.7)
        working-directory: scene
        run: uv run python -m scene.cli --check
      - name: Scene sha256 (must match the Air; row 2.5)
        working-directory: scene
        run: |
          uv run python -m scene.cli --trays 1 --cells 4x4 --shelf-gap 0.08 --out "$RUNNER_TEMP/scene/rookery.xml"
          sha256sum "$RUNNER_TEMP"/scene/rookery.xml "$RUNNER_TEMP"/scene/rookery.json
      - name: Python gates
        working-directory: scene
        # pytest exits 5 when it collects no tests, which is expected until 2.2 lands.
        # -c: the args live outside scene/, so pytest would not find scene's
        # pyproject (python_files for phase*_*.py gates, pythonpath) on its own.
        run: uv run pytest ../tests/gates -q -c pyproject.toml || [ $? -eq 5 ]
      - run: 'echo "headless: pending Phase 4"'
